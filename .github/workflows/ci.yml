# CI: runs on every pull request (and on main) and must pass before merge.
#   secrets  - gitleaks over the full git history
#   backend  - ruff lint, pip-audit, pytest (when backend/tests exists)
#   frontend - eslint, tsc type check + Vite build, npm audit
#   infra    - helm lint/template, compose config, promtool, amtool
#   images   - Docker build for backend + frontend, Trivy scan (HIGH/CRITICAL)
#
# Third-party actions and scanner images are pinned to commit SHAs / digests.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  RUFF_VERSION: "0.17.1"
  PIP_AUDIT_VERSION: "2.9.0"
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
  TRIVY_IMAGE: aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git /repo --redact --verbose --exit-code 1

  backend:
    name: Backend (lint, audit, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install lint tools
        run: pip install "ruff==$RUFF_VERSION" "pip-audit==$PIP_AUDIT_VERSION"
      - name: Ruff
        run: ruff check backend --output-format=github
      - name: pip-audit (known CVEs in pinned dependencies)
        run: pip-audit -r backend/requirements.txt --no-deps --disable-pip --progress-spinner off
      - name: Check for tests
        id: tests
        run: |
          if compgen -G "backend/tests/**/*.py" > /dev/null || compgen -G "backend/tests/*.py" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::backend/tests not found; skipping pytest"
          fi
      - name: Install backend dependencies (CPU torch)
        if: steps.tests.outputs.present == 'true'
        run: |
          TORCH_VERSION="$(grep -E '^torch==' backend/requirements.txt | cut -d= -f3)"
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH_VERSION}"
          pip install -r backend/requirements.txt pytest pytest-cov httpx
      - name: Pytest
        if: steps.tests.outputs.present == 'true'
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint, type check, build, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check for frontend
        id: fe
        run: |
          if [[ -f frontend/package-lock.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::frontend/package-lock.json not found; skipping frontend checks"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.fe.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        if: steps.fe.outputs.present == 'true'
        working-directory: frontend
        run: npm ci --no-fund
      - name: ESLint
        if: steps.fe.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint
      - name: Type check and build
        if: steps.fe.outputs.present == 'true'
        working-directory: frontend
        run: npm run build
      - name: Unit tests
        if: steps.fe.outputs.present == 'true' && hashFiles('frontend/vitest.config.*', 'frontend/src/**/*.test.*') != ''
        working-directory: frontend
        run: npm test -- --run
      - name: npm audit (production deps, high+)
        if: steps.fe.outputs.present == 'true'
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  infra:
    name: Infra config (Helm, Compose, Prometheus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Helm lint
        run: |
          helm lint infra/helm/hfaio
          helm lint infra/helm/hfaio -f infra/helm/hfaio/values-kind.yaml
      - name: Helm template
        run: helm template hfaio infra/helm/hfaio -f infra/helm/hfaio/values-kind.yaml > /dev/null
      - name: Docker Compose config
        run: cp .env.example .env && docker compose config --quiet
      - name: promtool check config + rules
        run: |
          docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Alert rule unit tests
        run: |
          docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.5.0 test rules /etc/prometheus/tests/alerts.test.yml
      - name: amtool check-config
        run: |
          docker run --rm -v "$PWD/infra/alertmanager:/etc/alertmanager:ro" --entrypoint amtool \
            prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml

  images:
    name: Image build + Trivy (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check for Dockerfile
        id: df
        run: |
          if [[ -f ${{ matrix.service }}/Dockerfile && ( ${{ matrix.service }} != frontend || -f frontend/package-lock.json ) ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ matrix.service }} is not buildable on this branch yet; skipping"
          fi
      - name: Free disk space for the backend image (torch)
        if: steps.df.outputs.present == 'true' && matrix.service == 'backend'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.df.outputs.present == 'true'
      - name: Build
        if: steps.df.outputs.present == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.service }}
          load: true
          tags: hfaio-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy image scan
        if: steps.df.outputs.present == 'true'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            hfaio-${{ matrix.service }}:ci
