# Default values for the HFAIO chart.
# Override per environment with -f values-<env>.yaml or --set.

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# Pod-level hardening shared by every workload.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

backend:
  image:
    repository: ghcr.io/jomilojuking/hfaio-backend
    tag: ""            # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  # Must stay at 1 while job/study state lives in memory (backend/app/state.py).
  replicaCount: 1
  uid: 10001
  port: 8000
  service:
    type: ClusterIP
    port: 8000
  # Non-secret config, rendered into a ConfigMap.
  env:
    LOG_LEVEL: INFO
    MAX_TRAIN: "2000"
    MAX_EVAL: "500"
    SUGGEST_MODEL: meta-llama/Llama-3.2-3B-Instruct
    MLFLOW_TRACKING_URI: ""
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # Importing torch/transformers is slow; give startup up to 5 minutes.
  startupProbe:
    httpGet: { path: /health, port: http }
    periodSeconds: 5
    failureThreshold: 60
  readinessProbe:
    httpGet: { path: /health, port: http }
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  livenessProbe:
    httpGet: { path: /health, port: http }
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  # /data holds optuna.db, mlflow.db, checkpoints and the HF cache.
  persistence:
    enabled: false
    size: 10Gi
    storageClass: ""
  # Disabled until state moves to Postgres: extra replicas would not share jobs.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: /metrics

frontend:
  enabled: true
  image:
    repository: ghcr.io/jomilojuking/hfaio-frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  uid: 101
  port: 8080
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  readinessProbe:
    httpGet: { path: /healthz, port: http }
    periodSeconds: 10
  livenessProbe:
    httpGet: { path: /healthz, port: http }
    periodSeconds: 20
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  podAnnotations: {}

# Secrets. Prefer existingSecret (created out of band, or by CD from GitHub
# Actions secrets). Only when existingSecret is empty does the chart create a
# Secret from the values below; never put real values in a committed file.
secrets:
  existingSecret: ""
  HF_TOKEN: ""
  HF_REPO: ""

ingress:
  enabled: false
  className: ""     # e.g. traefik, haproxy, or your cloud's ingress class
  annotations: {}
  hosts:
    - host: hfaio.local
  tls: []
  #  - secretName: hfaio-tls
  #    hosts: [hfaio.local]

# Image used by the `helm test` smoke test.
smokeTest:
  image: curlimages/curl:8.15.0
