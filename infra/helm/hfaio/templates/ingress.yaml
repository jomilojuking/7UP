{{- if and .Values.ingress.enabled .Values.frontend.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hfaio.fullname" . }}
  labels:
    {{- include "hfaio.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          # The frontend's nginx serves the SPA and proxies /api to the backend.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hfaio.frontend.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
