{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hfaio.secretName" . }}
  labels:
    {{- include "hfaio.labels" . | nindent 4 }}
type: Opaque
stringData:
  HF_TOKEN: {{ .Values.secrets.HF_TOKEN | quote }}
  HF_REPO: {{ .Values.secrets.HF_REPO | quote }}
{{- end }}
