apiVersion: v1
kind: Service
metadata:
  name: {{ include "hfaio.backend.fullname" . }}
  labels:
    {{- include "hfaio.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "hfaio.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
