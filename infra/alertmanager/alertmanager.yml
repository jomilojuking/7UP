# Routes every alert to Slack. The webhook URL is never stored in git: the
# container writes $SLACK_WEBHOOK_URL to /tmp/slack_webhook_url at startup.
global:
  resolve_timeout: 5m
  slack_api_url_file: /tmp/slack_webhook_url

route:
  receiver: slack
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 2m
  repeat_interval: 2h

receivers:
  - name: slack
    slack_configs:
      - send_resolved: true
        title: '{{ if eq .Status "firing" }}:rotating_light:{{ else }}:white_check_mark:{{ end }} [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}  *Service:* {{ .Labels.service }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
        actions:
          - type: button
            text: "Runbook"
            url: '{{ (index .Alerts 0).Annotations.runbook_url }}'

inhibit_rules:
  # If the backend is down, do not also page for its error rate or latency.
  - source_matchers: ['alertname="BackendDown"']
    target_matchers: ['service="backend"']
    equal: ["service"]
