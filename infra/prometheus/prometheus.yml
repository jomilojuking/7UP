# Prometheus config for the Docker Compose stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: hfaio
    env: local

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # FastAPI backend: request rate, latency histograms, status codes
  # (prometheus-fastapi-instrumentator on /metrics).
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: backend

  # Host CPU / memory / disk.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Model-serving pods will be added here once the model-serving chart ships
  # (see docs/infra.md, "Roadmap").
