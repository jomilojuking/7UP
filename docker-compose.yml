# HFAIO full local stack: `cp .env.example .env && docker compose up --build`
#
#   Frontend   http://localhost:3000   (nginx; proxies /api -> backend)
#   Backend    http://localhost:8000   (FastAPI; /health, /metrics, /docs)
#   MLflow     http://localhost:5000
#   Prometheus http://localhost:9090
#   Alertmgr   http://localhost:9093
#   Grafana    http://localhost:3001   (admin / $GRAFANA_ADMIN_PASSWORD)
#
# Every port binds to 127.0.0.1 only, so nothing is exposed to the network.
# Config comes from .env (see .env.example); secrets never live in this file.

name: hfaio

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------- app
  backend:
    build:
      context: ./backend
    image: hfaio-backend:local
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hfaio}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-hfaio}
      REDIS_URL: redis://redis:6379/0
      HF_TOKEN: ${HF_TOKEN:-}
      HF_REPO: ${HF_REPO:-}
      SUGGEST_MODEL: ${SUGGEST_MODEL:-meta-llama/Llama-3.2-3B-Instruct}
      MAX_TRAIN: ${MAX_TRAIN:-2000}
      MAX_EVAL: ${MAX_EVAL:-500}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    restart: unless-stopped
    logging: *logging

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: hfaio-frontend:local
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging

  # ---------------------------------------------------------- data stores
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hfaio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hfaio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  # ---------------------------------------------------- experiment tracking
  mlflow:
    build:
      context: ./infra/mlflow
    image: hfaio-mlflow:local
    environment:
      # Turn off MLflow 3's GenAI background job workers; HFAIO only uses tracking.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-hfaio}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/mlflow
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      # Each worker loads MLflow (~250 MB); 2 is plenty for a team of three.
      - --workers=2
      - --artifacts-destination=/mlartifacts
      - --serve-artifacts
      # MLflow 3 rejects unknown Host headers; allow in-network and local access.
      - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*
      - --cors-allowed-origins=http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_artifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1536m
    restart: unless-stopped
    logging: *logging

  # ------------------------------------------------------------- monitoring
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    mem_limit: 512m
    restart: unless-stopped
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    # Alertmanager does not expand env vars in its config, so write the Slack
    # webhook from the environment to a file that the config points at.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        printf '%s' "$${SLACK_WEBHOOK_URL}" > /tmp/slack_webhook_url
        exec /bin/alertmanager \
          --config.file=/etc/alertmanager/alertmanager.yml \
          --storage.path=/alertmanager \
          --web.external-url=http://localhost:${ALERTMANAGER_PORT:-9093}
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    mem_limit: 128m
    restart: unless-stopped
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-health.json
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

volumes:
  backend_data:
  postgres_data:
  redis_data:
  mlflow_artifacts:
  prometheus_data:
  alertmanager_data:
  grafana_data:
